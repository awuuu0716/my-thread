name: Windows portable build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          architecture: x64
      - run: python -m pip install -e ".[bundle]"
      - run: python scripts/build_windows.py
      - uses: actions/upload-artifact@v4
        with:
          name: mythread-windows-x64
          path: |
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error
          retention-days: 14
