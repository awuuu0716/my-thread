name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and tests
        run: python -m pip install -e ".[dev]"
      - name: Install Chromium and Linux dependencies
        if: runner.os == 'Linux'
        run: python -m playwright install --with-deps chromium
      - name: Install Chromium on Windows
        if: runner.os == 'Windows'
        run: python -m playwright install chromium
      - name: Record dependency versions
        run: python -m pip list
      - name: Run offline and synthetic DOM tests
        run: python -m pytest -q

  package:
    name: Build package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Install wheel in clean environment
        run: |
          python -m venv /tmp/mythread-wheel-smoke
          /tmp/mythread-wheel-smoke/bin/python -m pip install dist/*.whl
          /tmp/mythread-wheel-smoke/bin/mythread --help
          /tmp/mythread-wheel-smoke/bin/mythread --version
