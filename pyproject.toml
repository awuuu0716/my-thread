[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mythread-terminal"
version = "0.2.0"
description = "A read-only Threads terminal client powered by a dedicated browser"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Communications",
]
requires-python = ">=3.11"
dependencies = ["textual>=8.2.8,<9", "platformdirs>=4,<5", "playwright>=1.55,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]
bundle = ["pyinstaller>=6.16,<7", "packaging>=24"]

[project.scripts]
mythread = "mythread.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
