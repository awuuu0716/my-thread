[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mythread-terminal"
version = "0.1.0"
description = "A personal, text-only Threads terminal client"
requires-python = ">=3.11"
dependencies = ["textual>=8.2.8,<9", "httpx>=0.28.1,<1", "keyring>=25.7,<26", "platformdirs>=4,<5"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]
local-https = ["cryptography>=43"]

[project.scripts]
mythread = "mythread.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
